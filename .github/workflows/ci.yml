name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type-check (mypy)
        run: mypy src

      - name: Unit + integration tests (pytest)
        run: pytest -v --cov=compliance_copilot --cov-report=term-missing

      - name: Faithfulness eval harness (offline, MockLLM)
        env:
          OTEL_TRACING_ENABLED: "false"
        run: python scripts/run_faithfulness_eval.py

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t compliance-copilot:ci .

      - name: Smoke-test the built image
        run: |
          docker run -d --name compliance-copilot-ci -p 8000:8000 compliance-copilot:ci
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/readyz; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8000/healthz
          curl -sf http://localhost:8000/readyz
          docker logs compliance-copilot-ci
          docker stop compliance-copilot-ci
