apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: compliance-copilot
  labels:
    app: compliance-copilot
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: compliance-copilot
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      # Avoid flapping: a RAG service rebuilds its in-memory index on
      # pod start, so scaling down too eagerly is more expensive than
      # for a stateless service.
      stabilizationWindowSeconds: 300
